# Vaste monitorronde van The Talent Tent (TT-304).
#
# Waarom hier en niet in een sessie: `tests/tt_monitor.py` draait alleen als
# iemand hem start. Deze workflow is de loper die dat vanzelf doet - elke drie
# dagen, en bij elke push naar main. Zakt de monitor, dan eindigt de run rood
# en stuurt GitHub daar een mail over naar de eigenaar van de repo.
#
# Deze workflow staat BEWUST alleen in de productierepo, naast `static.yml`.
# Tweede bewuste uitzondering op §2 regel 2 van de projectinstructies
# (besluit Ronald, 21-09-2026).
#
# Let op: GitHub zet een `schedule` in een publieke repo uit na 60 dagen
# zonder activiteit. Een push of een handmatige start zet hem weer aan.
#
# `tests/tt_tests.py` draait hier BEWUST niet (besluit Ronald, 21-09-2026, na
# de eerste rode run). Drie gronden:
#   1. Blok D van de monitor toetst `CHECKSUMS.txt` tegen de bestanden. Klopt
#      dat, dan zijn de bestanden in de repo dezelfde als die Claude in de
#      sessie al met `tt_tests.py` heeft getoetst. De CI-run levert dan geen
#      nieuwe informatie op.
#   2. `tt_tests.py` heeft Playwright nodig: een pip-installatie, een
#      chromium-download en apt-pakketten. Dat is de enige zware
#      afhankelijkheid van de hele workflow, en de runner-image schuift
#      (ubuntu-latest wordt Ubuntu 26 op 19-10-2026).
#   3. Een rode run om een kapotte installatie kost meer vertrouwen dan hij
#      oplevert - dezelfde regel als bovenin `tests/tt_monitor.py`.
# Komt er later toch gedragstoetsing in CI, dan hoort die in een APARTE
# workflow, zodat een Playwright-storing de monitor nooit rood kleurt.

name: Monitor

on:
  schedule:
    # Elke drie dagen om 06:00 UTC (08:00 Nederlandse zomertijd).
    - cron: "0 6 */3 * *"
  push:
    branches: ["main"]
  # Zelf starten kan via de Actions-tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "monitor"
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Node klaarzetten
        # tt_monitor.py gebruikt `node --check` per JS-bestand.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Monitorronde
        run: python3 tests/tt_monitor.py
